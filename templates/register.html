{% extends 'base.html' %}{% block title %}Create account{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="eyebrow">GET STARTED</div><h1>Create your account</h1><p class="muted">Register as a student to access available examinations.</p><form method="post" class="form-stack"><label>Full name<input type="text" name="name" required autocomplete="name" placeholder="Alex Student"></label><label>Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><label>Confirm password<input type="password" name="confirm_password" required minlength="8" autocomplete="new-password" placeholder="Repeat your password"></label><button class="button button-primary button-full" type="submit">Create account</button></form><p class="form-footer">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></div>{% endblock %}
