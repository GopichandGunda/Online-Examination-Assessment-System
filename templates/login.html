{% extends 'base.html' %}{% block title %}Sign in{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="eyebrow">WELCOME BACK</div><h1>Sign in to Examwise</h1><p class="muted">Continue to your assessment workspace.</p><form method="post" class="form-stack"><label>Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="Your password"></label><button class="button button-primary button-full" type="submit">Sign in</button></form><p class="form-footer">New here? <a href="{{ url_for('register') }}">Create an account</a></p><div class="demo-note"><strong>Demo access</strong><br>Student: student@example.com / Student@123<br>Admin: admin@example.com / Admin@123</div></div></div>{% endblock %}
